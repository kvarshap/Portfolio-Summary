<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="robots" content="noindex,nofollow">
<link rel="apple-touch-icon" href="apple-touch-icon.png">
<link rel="icon" href="apple-touch-icon.png">
<meta name="theme-color" content="#f4f6fa" media="(prefers-color-scheme: light)">
<meta name="theme-color" content="#0b1220" media="(prefers-color-scheme: dark)">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-title" content="Portfolio">
<title>Portfolio</title>
<style>
:root{
  --bg:#f4f6fa;--card:#fff;--ink:#0f172a;--mute:#64748b;--line:#e2e8f0;
  --up:#15803d;--dn:#b91c1c;--buy:#1d4ed8;--sell:#c2410c;--warn:#a16207;
  --upbg:#dcfce7;--dnbg:#fee2e2;--buybg:#dbeafe;--sellbg:#ffedd5;--chip:#eef2f7;
}
@media (prefers-color-scheme:dark){
  :root{--bg:#0b1220;--card:#131c2e;--ink:#e8edf6;--mute:#8b9ab3;--line:#22304a;
  --up:#4ade80;--dn:#f87171;--buy:#60a5fa;--sell:#fb923c;--warn:#facc15;
  --upbg:#12361f;--dnbg:#401a1a;--buybg:#16294d;--sellbg:#41240f;--chip:#1b2740}
}
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
html,body{margin:0;background:var(--bg);color:var(--ink);font:15px/1.4 system-ui,-apple-system,"Segoe UI",Roboto,sans-serif}
body{padding-top:env(safe-area-inset-top,0);padding-bottom:calc(64px + env(safe-area-inset-bottom,0))}
.wrap{max-width:640px;margin:0 auto;padding:12px}
.up{color:var(--up)}.dn{color:var(--dn)}.mute{color:var(--mute)}
.num{font-variant-numeric:tabular-nums}

/* header summary */
.hero{background:var(--card);border:1px solid var(--line);border-radius:16px;padding:14px}
.hero-top{display:flex;justify-content:space-between;align-items:flex-start;gap:8px}
.lbl{font-size:12px;color:var(--mute);text-transform:uppercase;letter-spacing:.04em}
.big{font-size:30px;font-weight:700;line-height:1.15}
.grid3{display:grid;grid-template-columns:repeat(3,1fr);gap:8px;margin-top:12px}
.grid3>div{background:var(--chip);border-radius:10px;padding:8px 10px}
.grid3 b{display:block;font-size:15px}
.iconbtn{border:1px solid var(--line);background:var(--card);color:var(--ink);border-radius:10px;min-width:44px;height:44px;font-size:18px}
.iconbtn:active{opacity:.6}
.status{font-size:12px;color:var(--mute);margin:8px 2px}
.banner{border-radius:10px;padding:10px 12px;margin:8px 0;font-size:13px;background:var(--sellbg);color:var(--ink);border:1px solid var(--sell)}

/* chips */
.chips{display:flex;gap:8px;overflow-x:auto;padding:4px 0 8px;scrollbar-width:none}
.chips::-webkit-scrollbar{display:none}
.chip{flex:none;border:1px solid var(--line);background:var(--card);color:var(--ink);border-radius:999px;padding:8px 14px;font-size:14px;min-height:40px}
.chip.on{background:var(--ink);color:var(--bg);border-color:var(--ink)}
.tag{display:inline-block;font-size:11.5px;padding:2px 8px;border-radius:999px;background:var(--chip);color:var(--mute);margin:4px 4px 0 0}
.tag.buy{background:var(--buybg);color:var(--buy);font-weight:600}
.tag.sell{background:var(--sellbg);color:var(--sell);font-weight:600}
.tag.risk{background:var(--dnbg);color:var(--dn)}
.tag.hit{outline:2px solid currentColor;font-weight:700}

/* sections & rows */
h2{font-size:14px;margin:18px 4px 8px;display:flex;align-items:center;gap:8px;text-transform:uppercase;letter-spacing:.04em;color:var(--mute)}
h2.sec{cursor:pointer;user-select:none;min-height:44px;margin:8px 4px 4px}
h2 .chev{width:14px;display:inline-block;color:var(--ink)}
h2 .n{background:var(--ink);color:var(--bg);border-radius:999px;font-size:12px;padding:1px 8px}
.row{background:var(--card);border:1px solid var(--line);border-radius:14px;padding:12px;margin-bottom:8px}
.row.buy{border-left:5px solid var(--buy)}.row.sell{border-left:5px solid var(--sell)}
.r1{display:flex;justify-content:space-between;gap:10px;align-items:baseline}
.tk{font-weight:700;font-size:16px}
.nm{font-size:12px;color:var(--mute);white-space:nowrap;overflow:hidden;text-overflow:ellipsis;max-width:48vw}
.px{text-align:right}
.px b{font-size:16px;display:block}
.px small{display:block;font-size:11px;color:var(--mute);line-height:1.3}
.det{display:none;margin-top:10px;padding-top:10px;border-top:1px dashed var(--line);font-size:13px}
.row.open .det{display:block}
.kv{display:grid;grid-template-columns:1fr 1fr;gap:6px 12px}
.kv span{color:var(--mute)}
.range{position:relative;height:6px;background:var(--chip);border-radius:6px;margin:14px 0 4px}
.range i{position:absolute;top:-4px;width:4px;height:14px;background:var(--ink);border-radius:2px}
.rl{display:flex;justify-content:space-between;font-size:12px;color:var(--mute)}
.det a{color:var(--buy);font-weight:600}
.more{width:100%;padding:12px;border:1px dashed var(--line);background:none;color:var(--mute);border-radius:12px;margin-bottom:8px;font-size:14px}
.empty{text-align:center;color:var(--mute);padding:28px 10px}

/* loss vs 52W table */
.tbl .tr{display:grid;grid-template-columns:1.1fr 1fr 1.1fr 1.1fr;gap:6px;padding:8px 0;border-top:1px solid var(--line);align-items:start;font-size:13px}
.tbl .tr.th{border-top:0;font-size:11px;color:var(--mute);text-transform:uppercase;letter-spacing:.04em;padding:4px 0}
.tbl small{display:block;font-size:11.5px;color:var(--mute);margin-top:1px}
.tbl small.up{color:var(--up);font-weight:600}
.tbl small.dn{color:var(--dn);font-weight:600}
.tbl .up b{color:var(--up)}.tbl .dn b{color:var(--dn)}
.tbl .hl{border-radius:8px;padding:2px 6px;margin:-2px -6px;font-weight:600}
.tbl .hl small{color:inherit;font-weight:600}
.tbl .hl.low{background:var(--buybg);color:var(--buy)}
.tbl .hl.high{background:var(--sellbg);color:var(--sell)}
.tbl .gh{margin:12px 0 2px;font-weight:700;font-size:13px;display:flex;gap:8px;align-items:center}
.tbl .gh .n{background:var(--ink);color:var(--bg);border-radius:999px;font-size:11px;padding:1px 8px}
/* inputs */
input[type=search],select,input[type=url]{width:100%;padding:12px;border-radius:12px;border:1px solid var(--line);background:var(--card);color:var(--ink);font-size:16px}
.bar{height:8px;border-radius:6px;background:var(--chip);overflow:hidden;margin-top:6px}
.bar i{display:block;height:100%;background:var(--buy)}

/* bottom nav */
nav{position:fixed;left:0;right:0;bottom:0;background:var(--card);border-top:1px solid var(--line);display:flex;padding-bottom:env(safe-area-inset-bottom,0);z-index:5}
nav button{flex:1;border:0;background:none;color:var(--mute);padding:8px 0 6px;font-size:11px;min-height:56px}
nav button span{display:block;font-size:20px;line-height:1.2}
nav button.on{color:var(--ink);font-weight:700}
nav .badge{position:absolute;margin-left:6px;background:var(--dn);color:#fff;border-radius:999px;font-size:10px;padding:0 5px;min-width:16px}

/* setup overlay */
#setup{position:fixed;inset:0;background:rgba(0,0,0,.55);display:none;align-items:flex-end;z-index:10}
#setup.show{display:flex}
#setup .sheet{background:var(--bg);width:100%;max-height:92vh;overflow:auto;border-radius:18px 18px 0 0;padding:16px calc(16px) calc(24px + env(safe-area-inset-bottom,0))}
.sheet label{display:block;font-size:13px;margin:12px 0 4px;color:var(--mute)}
.btn{border:0;border-radius:12px;padding:13px 16px;font-size:15px;font-weight:600;background:var(--ink);color:var(--bg);width:100%;margin-top:12px}
.btn.alt{background:var(--chip);color:var(--ink)}
.hint{font-size:12px;color:var(--mute);margin-top:6px}
</style>
</head>
<body>
<div class="wrap">
  <div class="hero">
    <div class="hero-top">
      <div>
        <div class="lbl">Portfolio value</div>
        <div class="big num" id="hVal">–</div>
      </div>
      <button class="iconbtn" id="btnRefresh" aria-label="Refresh">⟳</button>
    </div>
    <div class="grid3">
      <div><span class="lbl">Total P&amp;L</span><b class="num" id="hPnl">–</b></div>
      <div><span class="lbl">Today</span><b class="num" id="hDay">–</b></div>
      <div><span class="lbl">Invested</span><b class="num" id="hInv">–</b></div>
    </div>
  </div>
  <div class="status" id="status">Loading…</div>
  <div id="banner"></div>
  <main id="view"></main>
</div>

<nav>
  <button data-tab="act"><span>⚡</span>Act<i class="badge" id="bAct" hidden></i></button>
  <button data-tab="hold"><span>📋</span>Holdings</button>
  <button data-tab="alerts"><span>🔔</span>Alerts</button>
  <button data-tab="more"><span>📊</span>More</button>
</nav>

<div id="setup">
  <div class="sheet">
    <h3 style="margin:0 0 4px">Data source</h3>
    <div class="hint">Stored only on this phone (never sent anywhere except to Google to download your sheet).</div>
    <label for="uData">data.csv — published Google Sheet CSV link</label>
    <input type="url" id="uData" placeholder="https://docs.google.com/spreadsheets/d/e/…/pub?output=csv">
    <label for="uAlerts">alerts.csv — published Google Sheet CSV link (optional)</label>
    <input type="url" id="uAlerts" placeholder="https://docs.google.com/spreadsheets/d/e/…/pub?output=csv">
    <div class="hint">Google Sheets → File → Share → Publish to web → pick the tab → format “CSV”.</div>
    <div class="banner" id="setupMsg" hidden></div>
    <button class="btn" id="saveSetup">Save &amp; load</button>
    <label>Or load CSV files straight from this phone</label>
    <input type="file" id="fData" accept=".csv,text/csv"> <div class="hint">data.csv</div>
    <input type="file" id="fAlerts" accept=".csv,text/csv" style="margin-top:8px"> <div class="hint">alerts.csv</div>
    <button class="btn alt" id="closeSetup">Close</button>
  </div>
</div>

<script>
/* If your page is private you may paste the two links here; otherwise use the in-app setup (safer on a public repo). */
const DEFAULT_URLS = { data: "", alerts: "" };
const NEAR52 = 10;     // More tab: list stocks within this % of their 52-week high / low
const MORE_CAP = 25;   // More tab: max rows per list

const LS = {
  get(k){ try{ return localStorage.getItem(k) }catch(e){ return null } },
  set(k,v){ try{ localStorage.setItem(k,v) }catch(e){} }
};
const state = { stocks:[], alerts:[], tab:'act', filter:'all', q:'', sort:'name', fetchedAt:null, note:'', skipped:0, excluded:[], orphanAlerts:0, expanded:new Set(), showAll:{} };
state.openMore = (()=>{ try{ const v=JSON.parse(LS.get('open_more')||'null'); if(Array.isArray(v)) return new Set(v); }catch(e){} return new Set(['m_gain','m_loss','m_high','m_low']); })();
state.openSecs = (()=>{ try{ const v=JSON.parse(LS.get('open_secs')||'null'); if(Array.isArray(v)) return new Set(v); }catch(e){} return new Set(['trig','sell']); })();

/* ---------- helpers ---------- */
const esc = s => String(s??'').replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
const num = v => { const n = parseFloat(String(v??'').replace(/[^\d.\-]/g,'')); return isNaN(n) ? null : n; };
const inr = n => n.toLocaleString('en-IN',{maximumFractionDigits:0});
function money(n){ const s=n<0?'-':'', a=Math.abs(n); if(a>=1e7) return s+'₹'+(a/1e7).toFixed(2)+'Cr'; if(a>=1e5) return s+'₹'+(a/1e5).toFixed(2)+'L'; return s+'₹'+inr(a); }
const px = n => '₹'+n.toLocaleString('en-IN',{minimumFractionDigits:2,maximumFractionDigits:2});
const pc = n => Math.abs(n)<0.05 ? '0.0%' : (n>0?'+':'')+n.toFixed(1)+'%';
const cls = n => n>0?'up':n<0?'dn':'mute';
const arrow = n => n>0?'▲':n<0?'▼':'';

function parseCSV(text){
  const rows=[]; let row=[], f='', q=false;
  for(let i=0;i<text.length;i++){
    const c=text[i];
    if(q){ if(c==='"'){ if(text[i+1]==='"'){f+='"';i++;} else q=false; } else f+=c; }
    else if(c==='"') q=true;
    else if(c===','){ row.push(f); f=''; }
    else if(c==='\n'||c==='\r'){
      if(c==='\r'&&text[i+1]==='\n') i++;
      row.push(f); f='';
      if(row.some(x=>x.trim()!=='')) rows.push(row);
      row=[];
    } else f+=c;
  }
  row.push(f); if(row.some(x=>x.trim()!=='')) rows.push(row);
  if(!rows.length) return [];
  const head = rows.shift().map(h=>h.trim().replace(/^\uFEFF/,''));
  return rows.map(r=>Object.fromEntries(head.map((h,i)=>[h,(r[i]??'').trim()])));
}

/* ---------- data load ---------- */
const isEditLink = u => /docs\.google\.com\/spreadsheets\/d\/[^\/]+\/(edit|view|htmlview)|docs\.google\.com\/spreadsheets\/d\/[^\/]+\/?$/.test(u||'');
const EDIT_MSG = 'That is a Google Sheets edit/share link, not a published CSV link. In the sheet: File → Share → Publish to web → choose the tab → format CSV → Publish, then paste that link (it contains “/pub?output=csv”).';
function urls(){ return { data: LS.get('url_data')||DEFAULT_URLS.data, alerts: LS.get('url_alerts')||DEFAULT_URLS.alerts }; }

async function download(url){
  if(isEditLink(url)) throw new Error(EDIT_MSG);
  const u = url + (url.includes('?')?'&':'?') + 't=' + Date.now();
  const r = await fetch(u,{cache:'no-store'});
  if(!r.ok) throw new Error('HTTP '+r.status);
  return r.text();
}

let loading=false, lastAttempt=0;
async function load(){
  if(loading) return;                       // never run two downloads at once
  loading=true; const btn=document.getElementById('btnRefresh'); btn.disabled=true; btn.style.opacity='.5';
  try{ await _load(); } finally { loading=false; btn.disabled=false; btn.style.opacity=''; }
}
async function _load(){
  const u = urls();
  state.note='';
  if(!u.data){ ingest(LS.get('cache_data'), LS.get('cache_alerts')); if(!state.stocks.length){ openSetup(); setStatus('Add your data source to begin.'); render(); } else { state.note='No data link set — showing last saved copy.'; state.fetchedAt=+LS.get('cache_time')||null; finish(); } return; }
  lastAttempt=Date.now();
  setStatus('Refreshing…');
  try{
    const d = await download(u.data);
    let a = LS.get('cache_alerts')||'';
    if(u.alerts){ try{ a = await download(u.alerts); LS.set('cache_alerts',a);}catch(e){ state.note='Alerts sheet could not be refreshed; using last saved alerts.'; } }
    LS.set('cache_data',d); LS.set('cache_time',String(Date.now()));
    state.fetchedAt = Date.now(); ingest(d,a); finish();
  }catch(e){
    const cd = LS.get('cache_data');
    if(cd){ state.fetchedAt = +LS.get('cache_time')||null; state.note='Offline or blocked — showing last saved data. ('+e.message+')'; ingest(cd, LS.get('cache_alerts')); finish(); }
    else { setStatus('Could not load data.'); state.note = e.message===EDIT_MSG ? EDIT_MSG : 'Could not load data ('+e.message+'). Check your link under More → Data source settings, or load a CSV file from your phone there.'; openSetup(); render(); }
  }
}

function ingest(dataText, alertsText){
  const rows = dataText ? parseCSV(dataText) : [];
  const alertRows = alertsText ? parseCSV(alertsText) : [];
  const amap = {};
  alertRows.forEach(a=>{ amap[a.TICKER] = { buy:num(a['Buy Trigger Price'])||0, sell:num(a['Sell Trigger Price'])||0, lastAction:a['Last Action']||'', lastPrice:num(a['Last Price'])||0, date:a.Date||'' }; });
  let skipped=0; const stocks=[], excluded=[], dataTickers=new Set(); const problems=[];
  const badVal = v => v===undefined || v==='' || /^#|loading/i.test(v) || num(v)===null;
  rows.forEach(r=>{
    if(r.TICKER) dataTickers.add(r.TICKER);
    if(/^(false|no|n|0)$/i.test(r.Include||'')){ excluded.push(r.TICKER||'(unnamed row)'); return; }
    const cmp=num(r.CMP);
    if(!r.TICKER || cmp===null || cmp<=0){ skipped++; problems.push({t:r.TICKER||'(unnamed row)', fields:['CMP'], skipped:true}); return; }
    const miss=['HIGH52','LOW52','CLOSEYEST','CHANGE','CHANGEPCT'].filter(k=>badVal(r[k]));
    if((num(r.Quantity)||0)>0 && badVal(r['Avg Cost Price'])) miss.push('Avg Cost Price');
    if(miss.length) problems.push({t:r.TICKER, fields:miss, skipped:false});
    const qty=num(r.Quantity)||0, avg=num(r['Avg Cost Price'])||0;
    const value=qty*cmp, cost=qty*avg;
    const pnl = num(r['Profit/Loss']) ?? (value-cost);
    const pnlPct = num(r['Profit/Loss(%)']) ?? (cost>0?(pnl/cost*100):0);
    const chg=num(r.CHANGE)||0, pct=num(r.CHANGEPCT)||0;
    const hi=num(r.HIGH52)||0, lo=num(r.LOW52)||0;
    const al = amap[r.TICKER]||null;
    const s = { t:r.TICKER, name:r['Stock Name']||r.TICKER, qty, avg, cmp, value, cost, pnl, pnlPct, chg, pct, hi, lo,
      day:qty*chg, action:(r.Action||'').toUpperCase(), level:(r.LEVEL||'').toUpperCase(), sector:r['Sector Name']||'Others', al,
      held:qty>0 };
    s.nearHigh = hi>0 && cmp>=hi*0.95;
    s.nearLow  = lo>0 && cmp<=lo*1.05;
    s.big = Math.abs(pct)>=5;
    s.sellHit = !!(al && al.sell>0 && cmp>=al.sell && qty>0);
    s.buyHit  = !!(al && al.buy>0 && cmp<=al.buy);
    s.fromHigh = hi>0 ? Math.min(0,(cmp-hi)/hi*100) : null;   // 0 or negative: how far below the 52W high
    s.fromLow  = lo>0 ? Math.max(0,(cmp-lo)/lo*100) : null;   // 0 or positive: how far above the 52W low
    s.rangePos = hi>lo ? Math.min(100,Math.max(0,(cmp-lo)/(hi-lo)*100)) : 50;
    stocks.push(s);
  });
  const orphans = alertRows.filter(a=>a.TICKER && !dataTickers.has(a.TICKER) && ((num(a['Buy Trigger Price'])||0)>0 || (num(a['Sell Trigger Price'])||0)>0)).map(a=>a.TICKER);
  state.orphanAlerts = orphans.length; state.orphanList=orphans; state.problems=problems;
  state.stocks=stocks; state.skipped=skipped; state.excluded=excluded; state.alerts=alertRows;
}

function finish(){
  const t = state.fetchedAt ? new Date(state.fetchedAt).toLocaleString('en-IN',{day:'numeric',month:'short',hour:'2-digit',minute:'2-digit'}) : 'unknown';
  setStatus(`${state.stocks.length} stocks · fetched ${t}`);
  render();
}
function setStatus(t){ document.getElementById('status').textContent=t; }

/* ---------- computed ---------- */
function totals(){
  const held = state.stocks.filter(s=>s.held);
  const value = held.reduce((a,s)=>a+s.value,0), cost = held.reduce((a,s)=>a+s.cost,0);
  const pnl = held.reduce((a,s)=>a+s.pnl,0), day = held.reduce((a,s)=>a+s.day,0);
  const prev = value-day;
  return { value, cost, pnl, pnlPct: cost>0?pnl/cost*100:0, day, dayPct: prev>0?day/prev*100:0, count:held.length };
}
function sections(){
  const S=state.stocks, held=S.filter(s=>s.held);
  // Sort rule: SELL-type lists go most positive → most negative; BUY-type lists go most negative → most positive.
  // Key is P/L % (Big movers uses today's % since that section is about today's move).
  const sellOrder=(key)=>(a,b)=>key(b)-key(a), buyOrder=(key)=>(a,b)=>key(a)-key(b);
  const PL=s=>s.pnlPct, TODAY=s=>s.pct;
  const mixed=(isSell,key)=>(a,b)=> (isSell(b)-isSell(a)) || (isSell(a)?sellOrder(key):buyOrder(key))(a,b);   // SELL-type first, then BUY-type
  return [
    { k:'trig',  title:'🎯 Your triggers hit', items:S.filter(s=>s.buyHit||s.sellHit).sort(mixed(s=>s.sellHit?1:0,PL)), kind:s=>s.sellHit?'sell':'buy' },
    { k:'sell',  title:'🟠 Sheet says SELL', items:held.filter(s=>s.action==='SELL').sort(sellOrder(PL)), kind:()=>'sell' },
    { k:'nh',    title:'📈 Near 52-week high (held)', items:held.filter(s=>s.nearHigh && !(s.action==='SELL')).sort(sellOrder(PL)), kind:()=>'sell' },
    { k:'buy',   title:'🔵 Sheet says BUY', items:S.filter(s=>s.action==='BUY').sort(buyOrder(PL)), kind:()=>'buy' },
    { k:'nl',    title:'📉 Near 52-week low', items:S.filter(s=>s.nearLow && s.action!=='BUY').sort(buyOrder(PL)), kind:()=>'buy' },
    { k:'big',   title:'⚡ Big movers today (±5%)', items:S.filter(s=>s.big).sort(mixed(s=>s.pct>0?1:0,TODAY)), kind:s=>s.pct>0?'sell':'buy' },
  ];
}
function urgentCount(){ const S=state.stocks; return S.filter(s=>s.buyHit||s.sellHit).length; }

/* ---------- rendering ---------- */
function tags(s){
  const t=[];
  if(s.sellHit) t.push(`<span class="tag sell hit">Sell trigger ${px(s.al.sell)} hit</span>`);
  if(s.buyHit)  t.push(`<span class="tag buy hit">Buy trigger ${px(s.al.buy)} hit</span>`);
  if(s.action==='SELL') t.push('<span class="tag sell">Sheet: SELL</span>');
  if(s.action==='BUY')  t.push('<span class="tag buy">Sheet: BUY</span>');
  if(s.level==='RISK')  t.push('<span class="tag risk">RISK</span>');
  if(s.nearHigh) t.push('<span class="tag">Near 52W high</span>');
  if(s.nearLow)  t.push('<span class="tag">Near 52W low</span>');
  if(s.big)      t.push(`<span class="tag">${pc(s.pct)} today</span>`);
  if(!s.held)    t.push('<span class="tag">Watchlist</span>');
  return t.join('');
}
function w52(s){
  const a = s.fromHigh===null ? '' : (s.fromHigh>-0.05 ? 'at 52W high' : `<b>${s.fromHigh.toFixed(1)}%</b> from 52W high`);
  const b = s.fromLow===null ? '' : (s.fromLow<0.05 ? 'at 52W low' : `<b>+${s.fromLow.toFixed(1)}%</b> above 52W low`);
  const t=[a,b].filter(Boolean).join(' · ');
  return t ? `<div class="mute num" style="margin-top:4px;font-size:12px">${t}</div>` : '';
}
function gf(s){ return `https://www.google.com/finance/quote/${encodeURIComponent(s.t)}:${/^\d+$/.test(s.t)?'BOM':'NSE'}`; }
function row(s,kind){
  const open = state.expanded.has(s.t);
  const sub = s.held ? `<span class="mute">P/L </span><b class="${cls(s.pnl)} num">${pc(s.pnlPct)}</b> <span class="mute">(${money(s.pnl)})</span>` : '<span class="mute">Not held</span>';
  return `<div class="row ${kind||''} ${open?'open':''}" data-t="${esc(s.t)}">
    <div class="r1">
      <div style="min-width:0"><div class="tk">${esc(s.t)}</div><div class="nm">${esc(s.name)}</div></div>
      <div class="px num"><b>${px(s.cmp)}</b><small>Avg price ${s.avg>0?px(s.avg):'–'}</small><small>${s.qty} shares</small><span class="${cls(s.pct)}">${arrow(s.pct)} ${pc(s.pct)}</span></div>
    </div>
    <div style="margin-top:6px;font-size:13px">${sub}</div>
    ${w52(s)}
    <div>${tags(s)}</div>
    <div class="det">
      <div class="kv num">
        <div><span>Value</span><br>${s.held?money(s.value):'–'}</div>
        <div><span>Today</span><br><b class="${cls(s.day)}">${s.held?money(s.day):'–'}</b></div>
        <div><span>Sector</span><br>${esc(s.sector)}</div>
        ${s.al&&s.al.buy>0?`<div><span>Buy trigger</span><br>${px(s.al.buy)} <small class="mute">(${pc((s.cmp-s.al.buy)/s.cmp*100)} away)</small></div>`:''}
        ${s.al&&s.al.sell>0?`<div><span>Sell trigger</span><br>${px(s.al.sell)} <small class="mute">(${pc((s.al.sell-s.cmp)/s.cmp*100)} away)</small></div>`:''}
      </div>
      <div class="range"><i style="left:calc(${s.rangePos}% - 2px)"></i></div>
      <div class="rl num"><span>52W low ${px(s.lo)}</span><span>${px(s.hi)} high</span></div>
      <div style="margin-top:10px"><a href="${gf(s)}" target="_blank" rel="noopener">Open in Google Finance ↗</a></div>
    </div>
  </div>`;
}

function renderAct(){
  if(!state.stocks.length) return '<div class="empty">No data yet.</div>';
  const seen = new Set();
  const secs = sections().map(sec=>({...sec, items:sec.items.filter(s=>{ if(seen.has(s.t)) return false; seen.add(s.t); return true; })})).filter(x=>x.items.length);
  let html = secs.length ? '<div class="status" style="margin-top:0">Each stock is listed once, under its most urgent reason — tags show every reason.</div>' : '<div class="empty">✅ Nothing needs attention right now.</div>';
  secs.forEach(sec=>{
    const limit = 5, all = state.showAll[sec.k];
    const shown = all ? sec.items : sec.items.slice(0,limit);
    const open = state.openSecs.has(sec.k);
    html += `<h2 class="sec" data-sec="${sec.k}" role="button" tabindex="0" aria-expanded="${open}"><span class="chev">${open?'▾':'▸'}</span>${sec.title} <span class="n">${sec.items.length}</span></h2>`;
    if(!open) return;
    html += shown.map(s=>row(s,sec.kind(s))).join('');
    if(sec.items.length>limit && !all) html += `<button class="more" data-more="${sec.k}">Show ${sec.items.length-limit} more</button>`;
  });
  return html;
}

function holdList(){
  const f=state.filter, q=state.q.trim().toLowerCase();
  let L = state.stocks.filter(s=>{
    if(q && !(s.t.toLowerCase().includes(q)||s.name.toLowerCase().includes(q))) return false;
    switch(f){
      case 'held': return s.held; case 'watch': return !s.held;
      case 'sell': return s.action==='SELL'; case 'buy': return s.action==='BUY';
      case 'risk': return s.level==='RISK'; case 'loss': return s.held && s.pnl<0;
      default: return true;
    }
  });
  const sorters = { value:(a,b)=>b.value-a.value, pnlPct:(a,b)=>b.pnlPct-a.pnlPct, pnlLow:(a,b)=>a.pnlPct-b.pnlPct, day:(a,b)=>b.pct-a.pct, dayLow:(a,b)=>a.pct-b.pct, name:(a,b)=>a.t.localeCompare(b.t) };
  L.sort(sorters[state.sort]);
  return `<div class="status">${L.length} shown</div>` + (L.map(s=>row(s, s.action==='SELL'?'sell':s.action==='BUY'?'buy':'')).join('') || '<div class="empty">No matches.</div>');
}
function renderHold(){
  const f=state.filter;
  const F=[['all','All'],['held','Held'],['sell','SELL'],['buy','BUY'],['loss','In loss'],['risk','RISK'],['watch','Watchlist']];
  return `<input type="search" id="q" placeholder="Search ticker or name" value="${esc(state.q)}" autocomplete="off">
    <div class="chips" style="margin-top:8px">${F.map(([k,l])=>`<button class="chip ${f===k?'on':''}" data-f="${k}">${l}</button>`).join('')}</div>
    <select id="sort" aria-label="Sort">
      <option value="name">Sort: Ticker A–Z</option><option value="value">Value (high → low)</option><option value="pnlPct">P/L % (best first)</option><option value="pnlLow">P/L % (worst first)</option>
      <option value="day">Today % (up first)</option><option value="dayLow">Today % (down first)</option>
    </select>
    <div id="list">${holdList()}</div>`;
}

function renderAlerts(){
  const items = state.stocks.filter(s=>s.al && (s.al.buy>0||s.al.sell>0)).map(s=>{
    const dBuy = s.al.buy>0 ? (s.cmp-s.al.buy)/s.cmp*100 : null;   // >0 means still above buy trigger
    const dSell = s.al.sell>0 ? (s.al.sell-s.cmp)/s.cmp*100 : null; // >0 means still below sell trigger
    const near = Math.min(...[dBuy,dSell].filter(x=>x!==null).map(x=>Math.max(x,0)));
    return { s, dBuy, dSell, near, hit: s.buyHit||s.sellHit };
  }).sort((a,b)=> (b.hit-a.hit) || (a.near-b.near));
  if(!items.length) return '<div class="empty">No active buy/sell triggers found in your alerts sheet.</div>';
  return `<div class="status">Sorted by closest to trigger. Triggers of 0 are ignored.</div>` + items.map(({s,dBuy,dSell,hit})=>{
    const lines=[];
    if(dBuy!==null) lines.push(s.buyHit?`<span class="tag buy hit">BUY hit · now ${px(s.cmp)} ≤ ${px(s.al.buy)}</span>`:`<span class="tag buy">Buy ≤ ${px(s.al.buy)} · ${dBuy.toFixed(1)}% to fall</span>`);
    if(dSell!==null) lines.push(s.sellHit?`<span class="tag sell hit">SELL hit · now ${px(s.cmp)} ≥ ${px(s.al.sell)}</span>`:`<span class="tag sell">Sell ≥ ${px(s.al.sell)} · ${dSell.toFixed(1)}% to rise</span>`);
    const last = (s.al.lastAction && !/^ignore$/i.test(s.al.lastAction) ? `<span class="tag">Last: ${esc(s.al.lastAction)} @ ${px(s.al.lastPrice)}</span>` : '') + (s.al.date ? `<span class="tag">Alert dated ${esc(s.al.date)}</span>` : '');
    return `<div class="row ${hit?(s.sellHit?'sell':'buy'):''}"><div class="r1"><div><div class="tk">${esc(s.t)}</div><div class="nm">${esc(s.name)}</div></div>
      <div class="px num"><b>${px(s.cmp)}</b><small>Avg price ${s.avg>0?px(s.avg):'–'}</small><small>${s.qty} shares</small><span class="${cls(s.pct)}">${arrow(s.pct)} ${pc(s.pct)}</span></div></div>
      <div>${lines.join('')}${last}</div></div>`;
  }).join('');
}

function moreSection(k,title,total,bodyHtml){
  const open=state.openMore.has(k);
  return `<h2 class="sec" data-msec="${k}" role="button" tabindex="0" aria-expanded="${open}"><span class="chev">${open?'▾':'▸'}</span>${title} <span class="n">${total}</span></h2>`+(open?bodyHtml:'');
}
function capNote(total){ return total>MORE_CAP ? `<div class="mute" style="font-size:12px;margin-top:8px">Showing ${MORE_CAP} of ${total}</div>` : ''; }
function moverTable(list,emptyMsg){
  if(!list.length) return `<div class="row tbl"><div class="mute">${emptyMsg}</div></div>`;
  const r=s=>`<div class="tr">
      <div><b>${esc(s.t)}</b><small>${s.qty} sh</small></div>
      <div class="num"><b>${px(s.cmp)}</b><small>Avg price ${s.avg>0?px(s.avg):'–'}</small></div>
      <div class="num ${cls(s.pct)}"><b>${arrow(s.pct)} ${pc(s.pct)}</b><small class="${cls(s.day)}">${money(s.day)}</small></div>
      <div class="num ${cls(s.pnl)}"><b>${pc(s.pnlPct)}</b><small class="${cls(s.pnl)}">${money(s.pnl)}</small></div>
    </div>`;
  return `<div class="row tbl"><div class="tr th"><div>Stock / shares</div><div>CMP / avg</div><div>Today</div><div>P/L</div></div>${list.slice(0,MORE_CAP).map(r).join('')}${capNote(list.length)}</div>`;
}
function rangeTable(list,mode){
  const word=mode==='high'?'high':'low';
  if(!list.length) return `<div class="row tbl"><div class="mute">None within ${NEAR52}% of their 52-week ${word}.</div></div>`;
  const r=s=>`<div class="tr">
      <div><b>${esc(s.t)}</b><small>${s.qty} sh</small>${s.held?`<small class="${cls(s.pnl)}">${pc(s.pnlPct)}</small>`:'<small>watchlist</small>'}</div>
      <div class="num"><b>${px(s.cmp)}</b><small>Avg price ${s.avg>0?px(s.avg):'–'}</small></div>
      <div class="num ${mode==='low'?'hl low':''}">${s.lo?px(s.lo):'–'}<small>${s.fromLow===null?'':(s.fromLow<0.05?'at low':'+'+s.fromLow.toFixed(1)+'%')}</small></div>
      <div class="num ${mode==='high'?'hl high':''}">${s.hi?px(s.hi):'–'}<small>${s.fromHigh===null?'':(s.fromHigh>-0.05?'at high':s.fromHigh.toFixed(1)+'%')}</small></div>
    </div>`;
  return `<div class="row tbl"><div class="mute" style="font-size:12px;margin-bottom:6px">Within ${NEAR52}% of the 52-week ${word}, closest first. P/L % under each ticker.</div>
    <div class="tr th"><div>Stock / shares</div><div>CMP / avg</div><div>52W low</div><div>52W high</div></div>${list.slice(0,MORE_CAP).map(r).join('')}${capNote(list.length)}</div>`;
}
function renderMore(){
  const S=state.stocks, held=S.filter(s=>s.held);
  const risk={SAFE:0,RISK:0}; held.forEach(s=>{ if(s.level==='RISK') risk.RISK+=s.value; else risk.SAFE+=s.value; });
  const gain=held.filter(s=>s.pct>0).sort((a,b)=>b.pct-a.pct);
  const loss=held.filter(s=>s.pct<0).sort((a,b)=>a.pct-b.pct);
  const nearHi=S.filter(s=>s.fromHigh!==null && s.fromHigh>=-NEAR52).sort((a,b)=>b.fromHigh-a.fromHigh);
  const nearLo=S.filter(s=>s.fromLow!==null && s.fromLow<=NEAR52).sort((a,b)=>a.fromLow-b.fromLow);
  const bars = (arr,total)=>arr.map(([k,v])=>`<div style="margin:10px 0"><div class="r1"><span>${esc(k)}</span><span class="num">${(v/total*100).toFixed(1)}% · ${money(v)}</span></div><div class="bar"><i style="width:${v/total*100}%"></i></div></div>`).join('');
  const rt=risk.SAFE+risk.RISK||1;
  const sk=(state.problems||[]).filter(x=>x.skipped), part=(state.problems||[]).filter(x=>!x.skipped);
  const excluded=state.excluded||[];
  const health = (!sk.length && !part.length && !excluded.length && !state.orphanAlerts)
    ? '✅ All rows look complete.'
    : [ excluded.length ? `<div>Excluded from analysis/listing (<b>${excluded.length}</b>):<br><b>${excluded.map(esc).join(', ')}</b></div>` : '',
        sk.length ? `<div style="margin-top:8px">Skipped — no usable price (<b>${sk.length}</b>):<br><b>${sk.map(x=>esc(x.t)).join(', ')}</b></div>` : '',
        part.length ? `<div style="margin-top:8px">Missing some fields (<b>${part.length}</b>):<br>${part.map(x=>`<b>${esc(x.t)}</b> <span class="mute">(${x.fields.map(esc).join(', ')})</span>`).join('<br>')}</div>` : '',
        state.orphanAlerts ? `<div style="margin-top:8px">Alert triggers with no matching stock in data.csv (<b>${state.orphanAlerts}</b>):<br><b>${state.orphanList.map(esc).join(', ')}</b></div>` : ''
      ].join('');
  return moreSection('m_gain','📈 Top gainers today (held)',gain.length,moverTable(gain,'No holdings are up today.'))
    + moreSection('m_loss','📉 Top losers today (held)',loss.length,moverTable(loss,'No holdings are down today.'))
    + moreSection('m_high','🔺 52-week high · within '+NEAR52+'%',nearHi.length,rangeTable(nearHi,'high'))
    + moreSection('m_low','🔻 52-week low · within '+NEAR52+'%',nearLo.length,rangeTable(nearLo,'low'))
    + `<h2>Risk split</h2><div class="row">${bars([['SAFE',risk.SAFE],['RISK',risk.RISK]],rt)}</div>
    <h2>Data health</h2><div class="row" style="font-size:13px">${health}</div>
    <button class="btn alt" id="openSetup">⚙ Data source settings</button>`;
}

function renderHero(){
  const T=totals();
  document.getElementById('hVal').textContent = money(T.value);
  document.getElementById('hPnl').innerHTML = `<span class="${cls(T.pnl)}">${money(T.pnl)} (${pc(T.pnlPct)})</span>`;
  document.getElementById('hDay').innerHTML = `<span class="${cls(T.day)}">${money(T.day)} (${pc(T.dayPct)})</span>`;
  document.getElementById('hInv').textContent = money(T.cost);
}

function render(){
  renderHero();
  document.getElementById('banner').innerHTML = state.note ? `<div class="banner">${esc(state.note)}</div>` : '';
  const n = urgentCount(), b=document.getElementById('bAct');
  b.hidden = !n; b.textContent = n;
  document.querySelectorAll('nav button').forEach(x=>x.classList.toggle('on',x.dataset.tab===state.tab));
  const v=document.getElementById('view');
  const keepScroll = window.scrollY;
  v.innerHTML = state.tab==='act'?renderAct(): state.tab==='hold'?renderHold(): state.tab==='alerts'?renderAlerts(): renderMore();
  const sel=document.getElementById('sort'); if(sel) sel.value=state.sort;
  window.scrollTo(0,keepScroll);
}

/* ---------- events ---------- */
document.addEventListener('click',e=>{
  const nb=e.target.closest('nav button'); if(nb){ state.tab=nb.dataset.tab; render(); window.scrollTo(0,0); return; }
  const f=e.target.closest('[data-f]'); if(f){ state.filter=f.dataset.f; render(); return; }
  const sh=e.target.closest('[data-sec]'); if(sh){ const k=sh.dataset.sec; state.openSecs.has(k)?state.openSecs.delete(k):state.openSecs.add(k); LS.set('open_secs',JSON.stringify([...state.openSecs])); render(); return; }
  const ms=e.target.closest('[data-msec]'); if(ms){ const k=ms.dataset.msec; state.openMore.has(k)?state.openMore.delete(k):state.openMore.add(k); LS.set('open_more',JSON.stringify([...state.openMore])); render(); return; }
  const m=e.target.closest('[data-more]'); if(m){ state.showAll[m.dataset.more]=true; render(); return; }
  if(e.target.closest('a')) return;
  const r=e.target.closest('.row[data-t]'); if(r){ const t=r.dataset.t; state.expanded.has(t)?state.expanded.delete(t):state.expanded.add(t); r.classList.toggle('open'); return; }
  if(e.target.id==='openSetup') openSetup();
});
document.addEventListener('keydown',e=>{ if((e.key==='Enter'||e.key===' ') && e.target.matches && e.target.matches('[data-sec],[data-msec]')){ e.preventDefault(); e.target.click(); } });
document.addEventListener('input',e=>{
  if(e.target.id==='q'){ state.q=e.target.value; document.getElementById('list').innerHTML=holdList(); }
});
document.addEventListener('change',e=>{ if(e.target.id==='sort'){ state.sort=e.target.value; render(); } });
document.getElementById('btnRefresh').onclick=()=>{
  const wait = 5*60*1000 - (Date.now()-lastAttempt);
  if(wait>0){ setStatus(`Refreshed recently — you can refresh again in ${Math.ceil(wait/60000)} min.`); setTimeout(()=>{ if(!loading && state.stocks.length) finish(); },3500); return; }
  load();
};

function openSetup(){ const u=urls(); document.getElementById('uData').value=u.data; document.getElementById('uAlerts').value=u.alerts; document.getElementById('setup').classList.add('show'); }
function closeSetup(){ document.getElementById('setup').classList.remove('show'); }
document.getElementById('closeSetup').onclick=closeSetup;
document.getElementById('saveSetup').onclick=()=>{
  const d=document.getElementById('uData').value.trim(), a=document.getElementById('uAlerts').value.trim();
  const msg=document.getElementById('setupMsg');
  if(isEditLink(d)||isEditLink(a)){ msg.textContent=EDIT_MSG; msg.hidden=false; return; }
  msg.hidden=true;
  LS.set('url_data',d); LS.set('url_alerts',a);
  closeSetup(); load();
};
function fromFile(inputId,key){
  document.getElementById(inputId).onchange=ev=>{
    const file=ev.target.files[0]; if(!file) return;
    const rd=new FileReader();
    rd.onload=()=>{ LS.set(key,rd.result); if(key==='cache_data') LS.set('cache_time',String(Date.now()));
      state.fetchedAt=Date.now(); state.note='Loaded from a file on this phone (not live).';
      ingest(LS.get('cache_data'),LS.get('cache_alerts')); closeSetup(); finish(); };
    rd.readAsText(file);
  };
}
fromFile('fData','cache_data'); fromFile('fAlerts','cache_alerts');

load();
</script>
</body>
</html>
